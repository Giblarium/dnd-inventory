<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Грузоподъёмность — D&D 5e</title>
<style>
  :root{
    --bg:#1a1410; --panel:#241c16; --panel2:#2e251d; --line:#3d3125;
    --gold:#c9a227; --text:#e8ddc8; --muted:#a89880;
    --ok:#4a9b5a; --warn:#e08a1e; --heavy:#d9661e; --over:#c0392b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.4;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:560px; margin:0 auto; padding:12px 12px 96px;}
  h1{font-size:1.15rem; margin:8px 4px 14px; color:var(--gold); letter-spacing:.03em;}
  h1 small{display:block; font-size:.7rem; color:var(--muted); font-weight:400; letter-spacing:0;}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .card h2{font-size:.8rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 12px;}
  .hint{font-size:.78rem; color:var(--muted); margin:-4px 0 12px;}

  .field{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .field label{flex:0 0 96px; color:var(--muted); font-size:.9rem;}
  input,select,button{font:inherit; color:var(--text);}
  input[type=text],input[type=number],select{
    flex:1; min-width:0; background:var(--panel2); border:1px solid var(--line);
    border-radius:10px; padding:10px 12px; outline:none;
  }
  input:focus,select:focus{border-color:var(--gold);}
  select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%); background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:32px;}
  .check{display:flex; align-items:center; gap:10px; padding:6px 0;}
  .check input{width:20px; height:20px; accent-color:var(--gold);}
  .check label{font-size:.9rem;}

  .summary{background:linear-gradient(160deg,var(--panel2),var(--panel));}
  .big{display:flex; align-items:baseline; gap:6px; margin-bottom:2px;}
  .big .carried{font-size:2.6rem; font-weight:700; line-height:1;}
  .big .of{font-size:1.1rem; color:var(--muted);}
  .status{display:inline-block; font-size:.85rem; font-weight:600; padding:4px 12px; border-radius:999px; margin:6px 0 12px;}
  .bar{height:12px; border-radius:999px; background:var(--line); overflow:hidden; position:relative; margin-bottom:14px;}
  .bar span{display:block; height:100%; width:0; border-radius:999px; transition:width .25s ease, background .25s ease;}
  .bar .tick{position:absolute; top:0; bottom:0; width:2px; background:rgba(0,0,0,.45);}
  .rows{display:grid; gap:6px; font-size:.88rem;}
  .rows .r{display:flex; justify-content:space-between; gap:10px;}
  .rows .r span:last-child{color:var(--text); font-variant-numeric:tabular-nums;}

  .item{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:10px; margin-bottom:10px;}
  .item .top{display:flex; gap:8px; align-items:center; margin-bottom:8px;}
  .item .bottom{display:flex; gap:8px; align-items:center;}
  .item .bottom .mini{flex:0 0 auto; width:86px;}
  .item .bottom .lbl{color:var(--muted); font-size:.82rem;}
  .item .line{flex:1; text-align:right; color:var(--gold); font-variant-numeric:tabular-nums; font-size:.95rem;}
  .del{background:none; border:1px solid var(--line); color:var(--over); border-radius:10px; width:42px; height:42px; font-size:1.1rem; cursor:pointer; flex:0 0 auto;}
  .del:active{background:rgba(192,57,43,.15);}

  .autocomplete{position:relative; flex:1; min-width:0;}
  .autocomplete input{width:100%;}
  .ac-list{position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--panel2); border:1px solid var(--gold); border-radius:10px; max-height:250px; overflow-y:auto; z-index:30; box-shadow:0 10px 26px rgba(0,0,0,.55);}
  .ac-list.hidden{display:none;}
  .ac-item{padding:9px 11px; border-bottom:1px solid var(--line); font-size:.92rem; cursor:pointer;}
  .ac-item:last-child{border-bottom:none;}
  .ac-item:active{background:rgba(201,162,39,.16);}
  .ac-item .ac-meta{display:block; color:var(--muted); font-size:.74rem; margin-top:2px;}
  .ac-item.ac-custom{color:var(--muted); cursor:default;}

  .btn{display:block; width:100%; padding:14px; border:none; border-radius:12px; background:var(--gold); color:#231b08; font-weight:700; cursor:pointer;}
  .btn:active{filter:brightness(.92);}
  .btn.ghost{background:none; border:1px solid var(--line); color:var(--muted); font-weight:500; margin-top:4px;}

  .empty{text-align:center; color:var(--muted); padding:20px 8px; font-size:.9rem;}
  .foot{position:fixed; left:0; right:0; bottom:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:linear-gradient(to top,var(--bg) 55%,rgba(26,20,16,0));}
  .foot .inner{max-width:560px; margin:0 auto;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Грузоподъёмность<small>Dungeons &amp; Dragons 5e</small></h1>

  <div class="card">
    <h2>Персонаж</h2>
    <div class="field"><label>Имя</label><input type="text" id="name" placeholder="Безымянный"></div>
    <div class="field"><label>Сила</label><input type="number" id="str" min="0" max="30" step="1" value="10"></div>
    <div class="field"><label>Размер</label>
      <select id="size">
        <option value="0.5">Крошечный (×½)</option>
        <option value="1" selected>Маленький / Средний (×1)</option>
        <option value="2">Большой (×2)</option>
        <option value="4">Огромный (×4)</option>
        <option value="8">Гигантский (×8)</option>
      </select>
    </div>
    <div class="check"><input type="checkbox" id="powerful"><label for="powerful">Мощное телосложение (как на размер больше)</label></div>
    <div class="field"><label>Единицы</label>
      <select id="unit">
        <option value="фнт" selected>Фунты (фнт)</option>
        <option value="кг">Килограммы (кг)</option>
      </select>
    </div>
  </div>

  <div class="card summary">
    <h2>Состояние</h2>
    <div class="big"><span class="carried" id="carried">0</span><span class="of" id="unitOf">из 0 фнт</span></div>
    <div id="status" class="status">Норма</div>
    <div class="bar"><span id="fill"></span><i class="tick" id="tick1"></i><i class="tick" id="tick2"></i></div>
    <div class="rows">
      <div class="r"><span>Без штрафов до</span><span id="t1">—</span></div>
      <div class="r"><span>Тяжёлая нагрузка до</span><span id="t2">—</span></div>
      <div class="r"><span>Макс. грузоподъёмность</span><span id="t3">—</span></div>
      <div class="r"><span>Свободно</span><span id="free">—</span></div>
      <div class="r"><span>Толкать / тянуть / поднимать</span><span id="push">—</span></div>
    </div>
  </div>

  <div class="card">
    <h2>Инвентарь</h2>
    <p class="hint">Начните печатать название — появится подсказка с весом. Свой предмет можно вписать вручную.</p>
    <div id="list"></div>
    <button class="btn ghost" id="add">+ Добавить предмет</button>
  </div>
</div>

<div class="foot"><div class="inner"><button class="btn" id="addTop">+ Добавить предмет</button></div></div>

p:"65 ЗМ"},{n:"Шалмей",c:"Инструмент",w:1,p:"2 ЗМ"},{n:"Яртинг",c:"Инструмент",w:2,p:"40 ЗМ"},{n:"Инструменты алхимика",c:"Ремесленный инструмент",w:8,p:"50 ЗМ"},{n:"Инструменты гончара",c:"Ремесленный инструмент",w:3,p:"10 ЗМ"},{n:"Инструменты каллиграфа",c:"Ремесленный инструмент",w:5,p:"10 ЗМ"},{n:"Инструменты каменщика",c:"Ремесленный инструмент",w:8,p:"10 ЗМ"},{n:"Инструменты картографа",c:"Ремесленный инструмент",w:6,p:"15 ЗМ"},{n:"Инструменты кожевника",c:"Ремесленный инструмент",w:5,p:"5 ЗМ"},{n:"Инструменты кузнеца",c:"Ремесленный инструмент",w:8,p:"20 ЗМ"},{n:"Инструменты пивовара",c:"Ремесленный инструмент",w:9,p:"20 ЗМ"},{n:"Инструменты плотника",c:"Ремесленный инструмент",w:6,p:"8 ЗМ"},{n:"Инструменты повара",c:"Ремесленный инструмент",w:8,p:"1 ЗМ"},{n:"Инструменты резчика по дереву",c:"Ремесленный инструмент",w:5,p:"1 ЗМ"},{n:"Инструменты ремонтника",c:"Ремесленный инструмент",w:10,p:"50 ЗМ"},{n:"Инструменты сапожника",c:"Ремесленный инструмент",w:5,p:"5 ЗМ"},{n:"Инструменты стеклодува",c:"Ремесленный инструмент",w:5,p:"30 ЗМ"},{n:"Инструменты ткача",c:"Ремесленный инструмент",w:5,p:"1 ЗМ"},{n:"Инструменты художника",c:"Ремесленный инструмент",w:5,p:"10 ЗМ"},{n:"Инструменты ювелира",c:"Ремесленный инструмент",w:2,p:"25 ЗМ"}];

(function(){
  "use strict";

  var KEY = "dnd5e_carry_v1";
  var LB_TO_KG = 0.45359237;
  var state = { name:"", str:10, size:1, powerful:false, unit:"фнт", items:[] };

  function uid(){ return Math.random().toString(36).slice(2,9); }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if(raw){ var d = JSON.parse(raw); state = Object.assign(state, d); }
    }catch(e){}
    if(!Array.isArray(state.items)) state.items = [];
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
  }

  function round1(n){ return Math.round(n*10)/10; }
  function fmt(n){
    n = round1(n);
    return (Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1));
  }

  // коэффициент пересчёта фунтов в выбранную единицу
  function uFactor(){ return state.unit === "кг" ? LB_TO_KG : 1; }

  function mult(){
    var m = Number(state.size) || 1;
    if(state.powerful){
      if(m === 0.5) m = 1;
      else m = m * 2;
    }
    return m;
  }

  function totals(){
    var str = Number(state.str) || 0;
    var m = mult();
    var t1 = str*5*m, t2 = str*10*m, max = str*15*m, push = str*30*m;
    var carried = state.items.reduce(function(s,it){
      var w = Number(it.weight) || 0, q = Number(it.qty) || 0;
      return s + w*q;
    }, 0);
    return { t1:t1, t2:t2, max:max, push:push, carried:carried };
  }

  function statusOf(carried, T){
    if(carried > T.max)  return { label:"Превышен предел", color:"var(--over)",
      note:"Нести невозможно." };
    if(carried > T.t2)   return { label:"Тяжёлая нагрузка", color:"var(--heavy)",
      note:"Скорость −20 фт; помеха на проверки, атаки и спасброски по Силе, Ловкости и Телосложению." };
    if(carried > T.t1)   return { label:"Нагрузка", color:"var(--warn)",
      note:"Скорость −10 фт." };
    return { label:"Норма", color:"var(--ok)", note:"" };
  }

  var el = function(id){ return document.getElementById(id); };

  function renderSummary(){
    var T = totals();
    var st = statusOf(T.carried, T);
    var f = uFactor();

    el("carried").textContent = fmt(T.carried * f);
    el("unitOf").textContent = "из " + fmt(T.max * f) + " " + state.unit;

    var badge = el("status");
    badge.textContent = st.label + (st.note ? " — " + st.note : "");
    badge.style.color = "#fff";
    badge.style.background = st.color;

    var pct = T.max > 0 ? Math.min(100, T.carried / T.max * 100) : (T.carried > 0 ? 100 : 0);
    var fill = el("fill");
    fill.style.width = pct + "%";
    fill.style.background = st.color;

    var mk = function(v){ return T.max > 0 ? Math.min(100, v / T.max * 100) : 0; };
    el("tick1").style.left = mk(T.t1) + "%";
    el("tick2").style.left = mk(T.t2) + "%";

    el("t1").textContent   = fmt(T.t1 * f) + " " + state.unit;
    el("t2").textContent   = fmt(T.t2 * f) + " " + state.unit;
    el("t3").textContent   = fmt(T.max * f) + " " + state.unit;
    el("push").textContent = fmt(T.push * f) + " " + state.unit;

    var free = (T.max - T.carried) * f;
    var node = el("free");
    node.textContent = (free >= 0 ? fmt(free) : "−" + fmt(-free)) + " " + state.unit;
    node.style.color = free >= 0 ? "var(--text)" : "var(--over)";
  }

  function searchEquip(q){
    q = q.trim().toLowerCase();
    if(!q) return [];
    var res = [], second = [], i, e, n;
    for(i=0;i<EQUIPMENT.length;i++){
      e = EQUIPMENT[i]; n = e.n.toLowerCase();
      if(n.indexOf(q) === 0) res.push(e);
      else if(n.indexOf(q) > 0) second.push(e);
      if(res.length >= 8) break;
    }
    for(i=0;i<second.length && res.length<8;i++) res.push(second[i]);
    return res.slice(0,8);
  }

  var DOWN_EVT = ("onpointerdown" in window) ? "pointerdown" : "mousedown";

  function itemRow(it){
    var row = document.createElement("div");
    row.className = "item";

    var top = document.createElement("div");
    top.className = "top";

    var ac = document.createElement("div");
    ac.className = "autocomplete";
    var name = document.createElement("input");
    name.type = "text"; name.className = "item-name";
    name.placeholder = "Название"; name.value = it.name || "";
    name.autocomplete = "off";
    var box = document.createElement("div");
    box.className = "ac-list hidden";
    ac.appendChild(name); ac.appendChild(box);

    var del = document.createElement("button");
    del.className = "del"; del.type = "button"; del.textContent = "✕";
    del.setAttribute("aria-label","Удалить");
    del.addEventListener("click", function(){
      state.items = state.items.filter(function(x){ return x.id !== it.id; });
      save(); renderList(); renderSummary();
    });
    top.appendChild(ac); top.appendChild(del);

    var bottom = document.createElement("div");
    bottom.className = "bottom";

    var wlbl = document.createElement("span"); wlbl.className = "lbl"; wlbl.textContent = "Вес";
    var weight = document.createElement("input");
    weight.type = "number"; weight.className = "mini"; weight.min = "0"; weight.step = "0.1";
    weight.inputMode = "decimal"; weight.placeholder = "0";
    weight.value = (it.weight === null || it.weight === undefined || it.weight === "") ? "" : fmt(Number(it.weight) * uFactor());
    weight.addEventListener("input", function(){
      var v = weight.value.trim();
      it.weight = (v === "") ? null : (Number(v) / uFactor());
      save(); renderSummary(); updateLine();
    });

    var qlbl = document.createElement("span"); qlbl.className = "lbl"; qlbl.textContent = "Кол-во";
    var qty = document.createElement("input");
    qty.type = "number"; qty.className = "mini"; qty.min = "0"; qty.step = "1";
    qty.inputMode = "numeric"; qty.placeholder = "1";
    qty.value = (it.qty === null || it.qty === undefined || it.qty === "") ? "1" : it.qty;
    qty.addEventListener("input", function(){
      it.qty = qty.value; save(); renderSummary(); updateLine();
    });

    var line = document.createElement("span");
    line.className = "line";
    function updateLine(){
      var v = (Number(it.weight) || 0) * (Number(it.qty) || 0) * uFactor();
      line.textContent = fmt(v) + " " + state.unit;
    }
    updateLine();

    function pick(eq){
      it.name = eq.n; name.value = eq.n;
      if(eq.w !== null && eq.w !== undefined){
        it.weight = eq.w;
        weight.value = fmt(eq.w * uFactor());
        updateLine();
      }
      box.classList.add("hidden");
      save(); renderSummary();
    }

    function showSuggestions(list){
      box.innerHTML = "";
      if(list.length === 0){
        var d = document.createElement("div");
        d.className = "ac-item ac-custom";
        d.textContent = "Свой предмет — вес впишите вручную";
        box.appendChild(d);
        box.classList.remove("hidden");
        return;
      }
      list.forEach(function(eq){
        var item = document.createElement("div");
        item.className = "ac-item";
        var t = document.createElement("div");
        t.textContent = eq.n;
        var meta = document.createElement("span");
        meta.className = "ac-meta";
        var parts = [];
        parts.push((eq.w === null || eq.w === undefined) ? "вес —" : fmt(eq.w * uFactor()) + " " + state.unit);
        if(eq.c) parts.push(eq.c);
        if(eq.p) parts.push(eq.p);
        meta.textContent = parts.join(" · ");
        item.appendChild(t); item.appendChild(meta);
        item.addEventListener(DOWN_EVT, function(ev){ ev.preventDefault(); pick(eq); });
        box.appendChild(item);
      });
      box.classList.remove("hidden");
    }

    name.addEventListener("input", function(){
      it.name = name.value;
      save();
      if(name.value.trim().length < 1){ box.classList.add("hidden"); return; }
      showSuggestions(searchEquip(name.value));
    });
    name.addEventListener("focus", function(){
      if(name.value.trim().length >= 1) showSuggestions(searchEquip(name.value));
    });
    name.addEventListener("blur", function(){
      setTimeout(function(){ box.classList.add("hidden"); }, 180);
    });

    bottom.appendChild(wlbl); bottom.appendChild(weight);
    bottom.appendChild(qlbl); bottom.appendChild(qty);
    bottom.appendChild(line);

    row.appendChild(top); row.appendChild(bottom);
    return row;
  }

  function renderList(){
    var box = el("list");
    box.innerHTML = "";
    if(state.items.length === 0){
      var e = document.createElement("div");
      e.className = "empty"; e.textContent = "Инвентарь пуст. Добавьте первый предмет.";
      box.appendChild(e); return;
    }
    state.items.forEach(function(it){ box.appendChild(itemRow(it)); });
  }

  function addItem(){
    state.items.push({ id:uid(), name:"", weight:null, qty:1 });
    save(); renderList(); renderSummary();
    var inputs = el("list").querySelectorAll(".item-name");
    if(inputs.length) inputs[inputs.length-1].focus();
  }

  load();

  el("name").value = state.name;
  el("name").addEventListener("input", function(){ state.name = el("name").value; save(); });
  el("str").value = state.str;
  el("str").addEventListener("input", function(){ state.str = el("str").value; save(); renderSummary(); });
  el("size").value = String(state.size);
  el("size").addEventListener("change", function(){ state.size = Number(el("size").value); save(); renderSummary(); });
  el("powerful").checked = !!state.powerful;
  el("powerful").addEventListener("change", function(){ state.powerful = el("powerful").checked; save(); renderSummary(); });
  el("unit").value = state.unit;
  el("unit").addEventListener("change", function(){ state.unit = el("unit").value; save(); renderList(); renderSummary(); });

  el("add").addEventListener("click", addItem);
  el("addTop").addEventListener("click", addItem);

  renderList();
  renderSummary();
})();
</script>
